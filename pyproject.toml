[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "scene-style-transfer"
version = "0.1.0"
description = "Scene-Structure-Aware Reference Coverage Routing for multi-reference style transfer"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "peft",
    "opencv-python",
    "Pillow",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "hydra-core",
    "omegaconf",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
