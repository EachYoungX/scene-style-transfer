schema_version: external_uv_environments_v1
manager: uv
shared_cache: ~/.cache/uv

environments:
  - environment_id: project_uv
    path: .venv
    python: "3.10"
    lockfile: uv.lock
    purpose: project_tests_and_internal_evaluation
    status: available
    command: uv run

  - environment_id: maskst_styleshot_uv
    path: external_benchmark/.venvs/maskst_styleshot_uv
    python: "3.10"
    source_requirements:
      - external_benchmark/vendor/maskst/requirements.txt
      - external_benchmark/vendor/styleshot/requirements.txt
    purpose: Track_A_native_and_Track_B_SD1.5_smoke
    status: ready_smoke_formal_aborted_over_8gb
    compatibility_overrides:
      - numpy==1.26.4
      - transformers==4.44.2
      - huggingface-hub==0.36.2
      - scikit-learn==1.5.2
    notes:
      - These repositories share the Torch 2.0.1 / torchvision 0.15.2 / Diffusers 0.29.1 family.
      - NumPy 2.x breaks the pinned OpenCV wheel; Transformers latest disables Torch 2.0.1 support; the official adapter code imports sklearn.cluster.KMeans without listing scikit-learn.
      - LD_LIBRARY_PATH must include /usr/lib/wsl/lib under WSL for the Torch 2.0.1 CUDA 11.7 wheel.
      - StyleShot Contour generation smoke passed; native official path exceeds the 8192 MB Track C limit.

  - environment_id: stylegallery_uv
    path: external_benchmark/.venvs/stylegallery_uv
    python: "3.10"
    source_requirements:
      - external_benchmark/vendor/stylegallery/requirements.txt
    purpose: Track_A_native_and_Track_C_4060_smoke
    status: ready_generation_smoke_passed
    notes:
      - Keep the official accelerated/offload route intact.
      - Record OOM as a valid Track C result instead of deleting modules.
      - uv install used NumPy 1.26.4 because the vendor pins conflict with scikit-image 0.25.2; txt2panoimg is unavailable on the configured index and is not imported by the demo path.
      - Official LCM accelerated smoke passed on RTX 4060 at reduced smoke settings; ViT-L depth, DINOv2, and SD1.5 loaded successfully.

  - environment_id: cocodiff_uv_legacy
    path: external_benchmark/.venvs/cocodiff_uv_legacy
    python: "3.10"
    source_requirements:
      - external_benchmark/vendor/cocodiff/CoCo.requirements.txt
      - external_benchmark/vendor/cocodiff/CoCo.environment.yml
    purpose: Track_A_native_smoke
    status: blocked_until_legacy_dependency_audit
    notes:
      - The repository documents a legacy Torch/CUDA stack; do not merge it into project_uv.

  - environment_id: adain_torch7
    path: null
    python: null
    purpose: Track_A_native_smoke
    status: blocked_not_python_uv
    notes:
      - Official AdaIN is Torch7 and requires th; uv cannot replace that runtime.

  - environment_id: efdm_project_uv
    path: .venv
    python: "3.10"
    source_requirements:
      - external_benchmark/vendor/efdm/ArbitraryStyleTransfer/requirements.txt
    purpose: EFDM_low_cost_smoke
    status: ready_formal_track_A
    notes:
      - The legacy pins are incompatible with the shared modern Torch stack, but the official inference modules import after reusing project_uv.
      - The official EFDM decoder asset is present locally at the project root and was validated with the official test.py.
      - The compatible VGG file is from the official AdaIN release because the EFDM README's VGG Drive link is currently unavailable.

  - environment_id: zstar_project_uv
    path: .venv
    python: "3.10"
    source_requirements:
      - external_benchmark/vendor/zstar/requirements.txt
    purpose: ZSTAR_bounded_smoke
    status: blocked_final_smoke_oom_8gb
    notes:
      - The official repository targets Python 3.8.8, CUDA 11.4, and Diffusers 0.15.0; the current project environment can load the local SD1.5 pipeline for a bounded compatibility check.
      - A clean-boot 512x512, 2-step, single-pair run reached synthesis but failed with CUDA out-of-memory; the process allocated about 14.1 GiB against an 8 GiB GPU.
